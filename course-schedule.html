---
title: Course Schedule
---
<style>
  :root { --csp: 0.92px; }   /* pixels per minute; sets the vertical time scale */

  .cs-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  .cs-legend { margin: 6px 0 14px; }
  .cs-legend span { display: inline-block; padding: 2px 9px; border-radius: 3px; margin-right: 6px; margin-bottom: 4px; font-size: 0.82em; border: 1px solid rgba(0,0,0,0.08); }

  .cs-wrap { overflow-x: auto; }
  table.cs-week { border-collapse: collapse; width: 100%; min-width: 860px; table-layout: fixed; }
  table.cs-week th, table.cs-week td { border: 1px solid #e3e3e3; }
  th.cs-day { background-color: #772953; color: #fff; padding: 8px 4px; font-weight: 600; text-align: center; font-size: 0.95em; }
  th.cs-corner { width: 62px; background-color: #fafafa; }
  td.cs-time { width: 62px; text-align: right; padding: 3px 7px 0 3px; color: #888; font-size: 0.78em; vertical-align: top; background-color: #fafafa; white-space: nowrap; box-sizing: border-box; }
  td.cs-cell { vertical-align: top; padding: 3px; }
  td.cs-empty { background-color: #fff; }
  td.cs-lunch { text-align: center; color: #b0b0b0; font-style: italic; font-size: 0.8em; background-color: #fafafa; letter-spacing: 0.05em; }

  td.cs-cell { height: 1px; }  /* lets the inner block fill the slot's full height */
  .cs-conc { display: flex; gap: 4px; align-items: stretch; height: 100%; }
  .cs-course { border-radius: 4px; padding: 4px 7px; box-sizing: border-box; overflow: hidden; flex: 1 1 0; min-width: 0; display: block; color: inherit; text-decoration: none; }
  .cs-course:hover, .cs-course:focus, .cs-course:visited { color: inherit; text-decoration: none; }
  .cs-course .code { font-weight: 700; font-size: 0.92em; }
  .cs-course .name { display: block; font-size: 0.8em; color: #2a2a2a; line-height: 1.2; margin-top: 1px; }
  .cs-course .meta { display: block; font-size: 0.74em; color: #555; margin-top: 2px; }
  #cs-loading { color: #888; font-style: italic; }

  @media print {
    :root { --csp: 0.38px; }
    .no-print { display: none !important; }
    .navbar, .bg-dark { display: none !important; }
    .container { border: none !important; background: none !important; box-shadow: none !important; padding: 0 !important; }
    .cs-head { margin-bottom: 5px; }
    .cs-head h2 { font-size: 15px; margin: 0; }
    .cs-head p { font-size: 10px; }
    .cs-wrap { overflow: visible !important; }
    table.cs-week { min-width: 0 !important; }
    body, .cs-course .name, .cs-course .meta { color: #000 !important; }
    th.cs-day { background-color: #772953 !important; padding: 2px; font-size: 9px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td.cs-time { font-size: 7.5px; padding: 1px 4px 0 2px; }
    td.cs-cell { padding: 1px; }
    .cs-conc { gap: 3px; }
    .cs-course { padding: 1px 4px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cs-course .code { font-size: 8.5px; }
    .cs-course .name { font-size: 7.5px; line-height: 1.1; margin-top: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cs-course .meta { font-size: 7px; margin-top: 0; }
    td.cs-lunch, th.cs-corner { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td.cs-lunch { font-size: 8px; }
    .cs-note { font-size: 8px; margin-top: 4px !important; }
    tr, td, .cs-course { page-break-inside: avoid; }
    @page { size: A4 landscape; margin: 7mm; }
  }
</style>

<div class="cs-head">
  <div>
    <h2 style="margin-bottom:2px;">Course Schedule</h2>
    <p class="text-muted" style="margin-bottom:0;">August-December 2026</p>
  </div>
  <button class="btn no-print" style="background-color:#772953; color:#fff;" onclick="window.print()">
    <i class="fa fa-file-pdf-o" aria-hidden="true"></i>&nbsp; Download as PDF
  </button>
</div>

<p class="cs-legend no-print">
  <span style="background-color: lightcyan;">Core for Int. Ph.D. 1st year and UG 3rd year</span>
  <span style="background-color: lavender;">Core for UG 3rd year only</span>
  <span style="background-color: lemonchiffon;">Core for Int. Ph.D. 1st year only</span>
  <span style="background-color: mistyrose;">Core for Int. Ph.D. 2nd year</span>
  <span style="background-color: #f4f4f4;">Elective</span>
</p>

<div id="cs-loading">Loading schedule&hellip;</div>
<div class="cs-wrap"><div id="cs-grid"></div></div>

<p class="text-muted cs-note" style="margin-top: 12px; font-size: 0.5em; text-align: right;">
  Cell heights and column widths are not to scale.
</p>

<script type="application/json" id="cs-course-data">
[
{% assign semester = site.data.courses.aug2026 %}
{% assign cats = "core1,core-ug,core-intphd,core2,electives,ug" | split: "," %}
{% for cat in cats %}
{% assign list = semester[cat] %}
{% if list %}{"type": "{{ cat }}", "courses": {{ list | jsonify }} }{% unless forloop.last %},{% endunless %}
{% endif %}
{% endfor %}
]
</script>

<script>
(function () {
  var COLORS = {
    "core1": "lightcyan", "core-ug": "lavender", "core-intphd": "lemonchiffon",
    "core2": "mistyrose", "electives": "#f4f4f4", "ug": "#f4f4f4"
  };
  var DAYS = [
    { key: "mon", label: "Monday" }, { key: "tue", label: "Tuesday" },
    { key: "wed", label: "Wednesday" }, { key: "thu", label: "Thursday" },
    { key: "fri", label: "Friday" }
  ];
  // Boundary times (minutes from midnight) used by the two lecture patterns.
  var MORNING = [480, 510, 540, 600, 660, 690, 720, 780];      // 8:00 .. 1:00
  var AFTERNOON = [840, 900, 930, 960, 1020];                  // 2:00 .. 5:00

  function parseTime(s) {
    var p = s.trim().split(":"), h = parseInt(p[0], 10), m = parseInt(p[1] || "0", 10);
    if (h === 12) return 720 + m;      // noon
    if (h >= 8) return h * 60 + m;     // morning (am)
    return (h + 12) * 60 + m;          // 1..5 -> pm
  }
  function minLabel(min) {
    var h = Math.floor(min / 60), m = min % 60, hh = h > 12 ? h - 12 : h;
    return hh + ":" + (m < 10 ? "0" + m : m);
  }
  function parseTiming(t) {
    if (!t) return null;
    var m = /^(Mon, Wed, Fri|Tue, Thu):\s*(.+?)\s*-\s*(.+)$/.exec(t.trim());
    if (!m) return null;
    return { pattern: m[1] === "Mon, Wed, Fri" ? "mwf" : "tuth", start: parseTime(m[2]), end: parseTime(m[3]) };
  }

  function courseHTML(c) {
    // Matches the site's own link rule (_includes/course-rows.html): a course's own
    // "webpage" field wins if set, otherwise it's /all-courses/<code-no-spaces-lowercased>.html.
    var href = c.webpage || ("{{ site.baseurl }}/all-courses/" + c.code.replace(/\s+/g, "").toLowerCase() + ".html");
    return '<a class="cs-course" href="' + href + '" style="background-color:' + (COLORS[c.type] || "#f4f4f4") + ';">' +
      '<span class="code">' + c.code + '</span>' +
      '<span class="name">' + c.name + '</span>' +
      '<span class="meta">' + c.instructor + (c.venue ? ' &middot; ' + c.venue : '') + '</span>' +
      '</a>';
  }

  function build(flat) {
    var byDay = { mon: {}, tue: {}, wed: {}, thu: {}, fri: {} };
    flat.forEach(function (c) {
      var p = parseTiming(c.timing);
      if (!p) return; // unscheduled (TBA) courses are omitted
      var days = p.pattern === "mwf" ? ["mon", "wed", "fri"] : ["tue", "thu"];
      days.forEach(function (d) {
        var g = byDay[d][p.start] || (byDay[d][p.start] = { end: p.end, courses: [] });
        g.courses.push(c);
      });
    });

    function segRows(bounds) {
      var rows = "", skip = { mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 };
      for (var bi = 0; bi < bounds.length - 1; bi++) {
        var bs = bounds[bi], be = bounds[bi + 1], mins = be - bs;
        rows += '<tr>';
        rows += '<td class="cs-time" style="height:calc(var(--csp) * ' + mins + ')">' + minLabel(bs) + '</td>';
        DAYS.forEach(function (d) {
          if (bi < skip[d.key]) return; // covered by a rowspan from above
          var g = byDay[d.key][bs];
          if (g) {
            var span = bounds.indexOf(g.end) - bi;
            skip[d.key] = bi + span;
            rows += '<td class="cs-cell" rowspan="' + span + '"><div class="cs-conc">' + g.courses.map(courseHTML).join("") + '</div></td>';
          } else {
            rows += '<td class="cs-empty"></td>';
          }
        });
        rows += '</tr>';
      }
      return rows;
    }

    var head = '<tr><th class="cs-corner"></th>' +
      DAYS.map(function (d) { return '<th class="cs-day">' + d.label + '</th>'; }).join("") + '</tr>';
    var lunch = '<tr><td class="cs-time" style="height:calc(var(--csp) * 60)">' + minLabel(780) +
      '</td><td class="cs-lunch" colspan="5">Lunch</td></tr>';
    return '<table class="cs-week"><thead>' + head + '</thead><tbody>' +
      segRows(MORNING) + lunch + segRows(AFTERNOON) + '</tbody></table>';
  }

  document.addEventListener("DOMContentLoaded", function () {
    var raw;
    try { raw = JSON.parse(document.getElementById("cs-course-data").textContent); }
    catch (e) { document.getElementById("cs-loading").textContent = "Could not load schedule data."; return; }
    var flat = [];
    raw.forEach(function (group) {
      (group.courses || []).forEach(function (c) {
        flat.push({ code: c.code, name: c.name, instructor: c.instructor, venue: c.venue, timing: c.timing, webpage: c.webpage, type: group.type });
      });
    });
    document.getElementById("cs-grid").innerHTML = build(flat);
    document.getElementById("cs-loading").style.display = "none";
  });
})();
</script>
